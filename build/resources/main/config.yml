# ===== 解析範囲 =====
region-radius: 16            # 変更ブロックから何ブロックまでを1回の解析対象にするか
max-nodes: 3000              # 1回の解析で扱う最大ブロック数 (超えた境界は「地盤」扱い)
max-iterations: 6            # 破断→荷重経路再計算を1tickで何回まで繰り返すか

# ===== 負荷制御 =====
max-analyses-per-tick: 3     # 1tickに解析する構造体の最大数
time-budget-ms: 6.0          # 1tickあたりの解析時間の上限(ms)。超えたら次tickへ持ち越し
max-collapse-per-tick: 48    # 1tickに崩落(落下ブロック化)させる最大数

# ===== 物理パラメータ =====
gravity-scale: 1.0           # 重力倍率 (大きいほど壊れやすい)
strength-scale: 1.0          # 全材料の強度倍率 (大きいほど頑丈)
min-safety-factor: 1.0       # 安全率がこれを下回ると損傷が進行 (1.0 = 応力が強度を超えたら)
damage-rate: 0.05            # 超過1.0あたり毎tickの損傷増加量 (1.0で結合破断)
instant-break-ratio: 3.0     # 使用率が限界の何倍を超えたら即破断(脆性破壊)するか

# ===== 演出 =====
visual-cracks: true          # 損傷が進んだブロックにひび割れ表示

# ===== 地盤(解析上は無限に頑丈な支持体として扱う) =====
# 自然地形が崩れないようにするためのリスト。
# プレイヤーが建築に使うブロック(STONE等)を崩壊対象にしたい場合は、ここから外す。
anchor-materials:
  - BEDROCK